name: Build FlClash TV APK

on:
  push:
    branches: [ "tv-remote-support" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 🔧 Setup Flutter (3.29+ for Dart 3.8+)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔧 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: 📦 Check Dart version
        run: dart --version

      - name: 📦 Install dependencies
        run: |
          flutter config --enable-linux-desktop 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake 2>/dev/null || true

      - name: 📦 Flutter pub get
        run: flutter pub get

      - name: 🏗️ Build Android APK
        run: |
          if grep -q "setup.dart" pubspec.yaml 2>/dev/null || [ -f "setup.dart" ]; then
            dart setup.dart android 2>&1 || true
          fi
          flutter build apk --release 2>&1 || true
          # 看看有没有生成 APK
          find build -name "*.apk" 2>/dev/null

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-TV-APK
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: 📤 Upload app bundle
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-TV-AAB
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: ignore
